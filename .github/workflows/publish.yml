name: Verify and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python tools/test_contract.py && python tools/test_release.py && python tools/package.py --check
      - name: Refresh public catalog
        run: >-
          curl -sS --fail-with-body -X POST https://apps.aiwizards.com/v1/publish
          -H 'content-type: application/json'
          -d '{"repo":"${{ github.repository }}"}'
